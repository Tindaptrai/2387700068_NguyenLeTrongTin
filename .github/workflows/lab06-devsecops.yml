name: Lab 06 DevSecOps

on:
  push:
    branches: [main]
    paths:
      - "Buoi 6/devsecops-demo/**"
      - ".github/workflows/lab06-devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "Buoi 6/devsecops-demo/**"
      - ".github/workflows/lab06-devsecops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Buoi 6/devsecops-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app.py tests

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Buoi 6/devsecops-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install bandit==1.9.4
      - run: bandit -r app.py -f sarif -o bandit.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-sarif
          path: Buoi 6/devsecops-demo/bandit.sarif
          retention-days: 7

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Buoi 6/devsecops-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt --format json --output pip-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit-json
          path: Buoi 6/devsecops-demo/pip-audit.json
          retention-days: 7

  secret-scan:
    name: Secret scan - Gitleaks
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: Buoi 6/devsecops-demo/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  iac-scan:
    name: IaC scan - Checkov
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: Buoi 6/devsecops-demo/iac
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          skip_check: CKV2_AWS_62,CKV_AWS_144
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iac-scan-sarif
          path: checkov.sarif
          retention-days: 7

  security-gate:
    name: Required security gate
    runs-on: ubuntu-latest
    if: always()
    needs: [test, sast, sca, secret-scan, iac-scan]
    steps:
      - name: Fail if any required job did not succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          IAC_RESULT: ${{ needs.iac-scan.result }}
        run: |
          for result in "$TEST_RESULT" "$SAST_RESULT" "$SCA_RESULT" "$SECRET_RESULT" "$IAC_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required security gate did not succeed: $result"
              exit 1
            fi
          done
          echo "All required security gates passed."